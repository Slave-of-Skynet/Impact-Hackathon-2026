{% load static library_tags design_tags %}{# Book cover. Context: book, size ("" | "cover-lg" | "cover-xl"). Real cover image when one exists, typographic cover otherwise. #}{% with img=book|book_cover %}<div class="cover {{ size }} {{ book.cover_color|cover_class }}{% if img %} has-img{% endif %}" aria-hidden="true">{% if img %}<img class="book-cover-img" src="{% static img %}" alt="" loading="lazy">{% else %}<span class="ct">{{ book.title }}</span><span class="ca">{{ book.author }}</span>{% endif %}</div>{% endwith %}
