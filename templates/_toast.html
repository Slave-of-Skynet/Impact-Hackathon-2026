{% load i18n %}
<div id="toast-container" aria-live="polite" aria-atomic="true">
  {% if messages %}
    {% for message in messages %}
      <div class="toast toast-{{ message.tags|default:'info' }}" role="{% if message.tags == 'error' %}alert{% else %}status{% endif %}" aria-live="polite">
        <svg class="icon toast-icon" aria-hidden="true"><use href="#i-{% if message.tags == 'success' %}check{% elif message.tags == 'error' or message.tags == 'warning' %}alert{% else %}info{% endif %}"/></svg>
        <span class="toast-message">{{ message }}</span>
        <button type="button" class="toast-close" aria-label="{% translate 'Închide notificarea' %}" onclick="this.closest('.toast').remove();"><svg class="icon" aria-hidden="true"><use href="#i-x"/></svg></button>
      </div>
    {% endfor %}
  {% endif %}
</div>
