{% load i18n %}<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% translate "Eroare de server" %} — Gustul Cărților</title>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  <main style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;">
    <div class="card" style="max-width: 560px; width: 100%; text-align: center; padding: 32px 24px;">
      <div style="font-size: 3rem; margin-bottom: 12px;" aria-hidden="true">⚠️</div>
      <h1 style="margin-bottom: 12px; font-size: 1.5rem;">{% translate "Ceva nu a funcționat" %}</h1>
      <p style="color: var(--color-text-muted); margin-bottom: 24px;">
        {% translate "A apărut o eroare neașteptată de partea noastră. Datele tale sunt în siguranță — te rugăm să încerci din nou mai târziu." %}
      </p>
      <div style="display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;">
        <a href="/" class="btn btn-primary">{% translate "Pagina principală" %}</a>
      </div>
    </div>
  </main>
</body>
</html>
